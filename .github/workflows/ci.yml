name: AEGIS — CI Test Suite

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-xdist

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -v \
            --tb=short \
            -x \
            --ignore=tests/test_config.py  # config test requires local paths

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: unittests
          name: aegis-coverage

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Check code style (black)
        run: black --check --diff src/ tests/ evaluation/

      - name: Check import order (isort)
        run: isort --check-only --diff src/ tests/ evaluation/

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ evaluation/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501

  model-check:
    name: Model File Availability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check model config references are valid
        run: |
          python -c "
          import yaml
          with open('config.yaml') as f:
              cfg = yaml.safe_load(f)
          model_path = cfg.get('model', {}).get('path', '')
          print(f'Model path configured: {model_path}')
          print('Config loaded successfully.')
          "

      - name: Validate YAML structure
        run: |
          python -c "
          import yaml
          import sys
          required_sections = ['model', 'compliance', 'database', 'video', 'alerts', 'evaluation']
          with open('config.yaml') as f:
              cfg = yaml.safe_load(f)
          missing = [k for k in required_sections if k not in cfg]
          if missing:
              print(f'ERROR: Missing config sections: {missing}', file=sys.stderr)
              sys.exit(1)
          print('All required config sections present.')
          "
