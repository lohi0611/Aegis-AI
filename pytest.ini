[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short tracebacks, print captured output for failures only
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -q

# Minimum test coverage enforcement (via pytest-cov when invoked with --cov)
# Run as: pytest --cov=src --cov-fail-under=60

# Custom markers
markers =
    integration: mark a test as requiring real model or hardware
    slow: mark a test as slow-running (>5s)
    unit: pure unit test requiring no external resources

# Ignore dataset directory and evaluation heavy tests without --run-integration flag
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch.*
    ignore::FutureWarning:ultralytics.*
