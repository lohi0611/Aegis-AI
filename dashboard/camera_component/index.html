<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Auto Camera Component</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    </style>
    <script>
        // Send message to Streamlit parent
        function sendMessage(type, data) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...data
            }, "*");
        }

        // Notify Streamlit we are ready
        window.addEventListener("load", function() {
            sendMessage("streamlit:componentReady", { apiVersion: 1 });
            sendMessage("streamlit:setFrameHeight", { height: 0 });
        });
    </script>
</head>
<body>
    <video id="video" width="640" height="480" autoplay playsinline muted style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let stream = null;
        let isReady = false;
        let inFlight = false;
        let lastSendTime = 0;

        // Initialize camera
        navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: "user"
            },
            audio: false
        })
        .then(function(s) {
            stream = s;
            video.srcObject = s;
            video.setAttribute("playsinline", true);
            video.play().then(function() {
                isReady = true;
                captureAndSend();
            }).catch(function(e) {
                console.log("Play catch:", e);
                isReady = true;
                captureAndSend();
            });
        })
        .catch(function(err) {
            console.error("Camera error:", err);
            sendMessage("streamlit:setComponentValue", { value: "ERROR: " + err.name + " - " + err.message });
        });

        function captureAndSend() {
            if (!isReady) return;
            const now = Date.now();
            // Allow sending if not in flight, OR if previous frame has been in flight for over 250ms (watchdog)
            if (inFlight && (now - lastSendTime < 250)) {
                return;
            }
            inFlight = true;
            lastSendTime = now;
            
            try {
                if (video.readyState >= 2) { // HAVE_CURRENT_DATA or higher
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.55);
                    sendMessage("streamlit:setComponentValue", { value: base64 });
                } else {
                    inFlight = false;
                }
            } catch (e) {
                console.error("Capture error:", e);
                inFlight = false;
            }
        }

        // Watchdog interval: continuously pushes frames every 90ms so the camera NEVER stops
        setInterval(function() {
            if (isReady) {
                captureAndSend();
            }
        }, 90);

        // Listen for parent messages (Streamlit Renders)
        window.addEventListener("message", function(event) {
            if (event.data && event.data.type === "streamlit:render") {
                inFlight = false;
                if (isReady) {
                    setTimeout(captureAndSend, 30);
                }
            }
        });
    </script>
</body>
</html>
