<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Auto Camera Component</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .cam-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            color: #81C784;
            background: rgba(76, 175, 80, 0.08);
            border-radius: 4px;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4CAF50;
            box-shadow: 0 0 6px #4CAF50;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
    <script>
        function sendMessage(type, data) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...data
            }, "*");
        }

        window.addEventListener("load", function() {
            sendMessage("streamlit:componentReady", { apiVersion: 1 });
            sendMessage("streamlit:setFrameHeight", { height: 28 });
        });
    </script>
</head>
<body>
    <div class="cam-badge">
        <span class="dot"></span>
        <span id="cam-status">Camera stream active</span>
    </div>

    <video id="video" width="640" height="480" autoplay playsinline muted style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('cam-status');
        let isReady = false;
        let inFlight = false;
        let lastSendTime = 0;

        // Initialize camera
        navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: "user"
            },
            audio: false
        })
        .then(function(s) {
            video.srcObject = s;
            video.setAttribute("playsinline", true);
            video.play().then(function() {
                isReady = true;
                if (statusEl) statusEl.textContent = "Live Camera Streaming";
                captureAndSend();
            }).catch(function(e) {
                isReady = true;
                captureAndSend();
            });
        })
        .catch(function(err) {
            console.error("Camera error:", err);
            if (statusEl) statusEl.textContent = "Camera Error: " + err.message;
            sendMessage("streamlit:setComponentValue", { value: "ERROR: " + err.name + " - " + err.message });
        });

        function captureAndSend() {
            if (!isReady) return;
            const now = Date.now();
            if (inFlight && (now - lastSendTime < 220)) {
                return;
            }
            inFlight = true;
            lastSendTime = now;
            
            try {
                if (video.readyState >= 2) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.50);
                    sendMessage("streamlit:setComponentValue", { value: base64 });
                } else {
                    inFlight = false;
                }
            } catch (e) {
                console.error("Capture error:", e);
                inFlight = false;
            }
        }

        // Active interval loop: continuously pumps camera frames
        setInterval(function() {
            if (isReady) {
                captureAndSend();
            }
        }, 80);

        // Listen for Streamlit render completion
        window.addEventListener("message", function(event) {
            if (event.data && event.data.type === "streamlit:render") {
                inFlight = false;
                if (isReady) {
                    setTimeout(captureAndSend, 20);
                }
            }
        });
    </script>
</body>
</html>
