<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AEGIS Live CCTV Viewport</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #080C12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #F1F5F9;
        }
        .cctv-container {
            position: relative;
            width: 100%;
            height: 420px;
            background: #06090E;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .cctv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(13, 18, 27, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'JetBrains Mono', monospace, sans-serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            z-index: 10;
        }
        .cctv-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #10B981;
            font-weight: 700;
        }
        .cctv-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #F59E0B;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-live {
            background: #EF4444;
            box-shadow: 0 0 6px #EF4444;
            animation: pulse 1.2s infinite;
        }
        .dot-green {
            background: #10B981;
            box-shadow: 0 0 6px #10B981;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }
        .video-viewport {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
            overflow: hidden;
        }
        video#video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        canvas#overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hud-scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #F59E0B 50%, transparent 100%);
            opacity: 0.65;
            animation: scan 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .cctv-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(13, 18, 27, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11px;
            z-index: 10;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 4px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10B981;
            font-weight: 600;
            font-size: 11px;
        }
        .status-error {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
            color: #EF4444;
        }
        .snap-btn {
            background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
            color: #090D13;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .snap-btn:hover { opacity: 0.9; }
        .permission-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 12, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            text-align: center;
            z-index: 20;
        }
        .permission-btn {
            background: #F59E0B;
            color: #080C12;
            border: none;
            padding: 8px 18px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
    <script>
        function sendMessage(type, data) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...data
            }, "*");
        }
        window.addEventListener("load", function() {
            sendMessage("streamlit:componentReady", { apiVersion: 1 });
            sendMessage("streamlit:setFrameHeight", { height: 425 });
        });
    </script>
</head>
<body>
    <div class="cctv-container">
        <!-- CCTV Header -->
        <div class="cctv-header">
            <div class="cctv-header-left">
                <span class="dot dot-green"></span>
                <span>CAM_01 [WEBCAM STREAM] • 30 FPS</span>
            </div>
            <div class="cctv-header-right">
                <span class="dot dot-live"></span>
                <span id="rec-timer">REC ● 00:00:00</span>
            </div>
        </div>

        <!-- Video Viewport -->
        <div class="video-viewport">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div class="hud-scan-line"></div>

            <!-- Permission / Fallback Overlay -->
            <div id="permission-screen" class="permission-screen" style="display:none;">
                <div style="font-size:32px;">📹</div>
                <div id="perm-title" style="font-size:14px;font-weight:700;">Connecting to Camera…</div>
                <div id="perm-desc" style="font-size:11px;color:rgba(241,245,249,0.6);max-width:320px;">
                    Please click "Allow" in your browser popup to start live worksite safety scanning.
                </div>
                <button id="perm-retry" class="permission-btn" onclick="initCamera()">Request Camera Access</button>
            </div>
        </div>

        <!-- Hidden processing canvas -->
        <canvas id="capture-canvas" width="640" height="480" style="display:none;"></canvas>

        <!-- CCTV Footer -->
        <div class="cctv-footer">
            <div id="status-pill" class="status-badge">
                <span class="dot dot-green"></span>
                <span id="status-text">Neural Inference Active</span>
            </div>
            <button class="snap-btn" onclick="captureAndSend(true)">
                <span>📸</span>
                <span>Audit &amp; Log Snapshot</span>
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const captureCanvas = document.getElementById('capture-canvas');
        const statusText = document.getElementById('status-text');
        const statusPill = document.getElementById('status-pill');
        const recTimer = document.getElementById('rec-timer');
        const permScreen = document.getElementById('permission-screen');
        const permTitle = document.getElementById('perm-title');
        const permDesc = document.getElementById('perm-desc');
        const permRetry = document.getElementById('perm-retry');

        let isReady = false;
        let lastSendTime = 0;
        let scanStartTime = Date.now();
        let simulatedWorkerX = 220;
        let scanDirection = 1;

        // Update REC timer
        setInterval(function() {
            if (!isReady) return;
            const elapsed = Math.floor((Date.now() - scanStartTime) / 1000);
            const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            recTimer.textContent = "REC ● " + hrs + ":" + mins + ":" + secs;
        }, 1000);

        function setStatus(text, isError) {
            statusText.textContent = text;
            if (isError) {
                statusPill.className = "status-badge status-error";
            } else {
                statusPill.className = "status-badge";
            }
        }

        function initCamera() {
            permScreen.style.display = "flex";
            permTitle.textContent = "Accessing Webcam…";
            permDesc.textContent = "Requesting video permission from browser…";
            permRetry.style.display = "none";

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                permTitle.textContent = "WebRTC Not Supported";
                permDesc.textContent = "This browser does not support WebRTC getUserMedia. Using simulated safety feed.";
                startSimulatedFeed();
                return;
            }

            navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 640, max: 1280 },
                    height: { ideal: 480, max: 720 },
                    facingMode: "user"
                },
                audio: false
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.setAttribute("muted", true);

                video.onloadedmetadata = function() {
                    video.play().then(function() {
                        isReady = true;
                        permScreen.style.display = "none";
                        setStatus("Neural Inference Active • 30 FPS", false);
                        resizeOverlay();
                        requestAnimationFrame(drawHUDLoop);
                        // Send initial capture
                        setTimeout(function() { captureAndSend(false); }, 500);
                    });
                };
            })
            .catch(function(err) {
                console.warn("Camera error:", err);
                permTitle.textContent = "Camera Permission Required";
                permDesc.textContent = "Camera access was blocked or denied. Click below to retry or switch to simulation.";
                permRetry.style.display = "block";
                // Start simulation feed so the user is never stuck
                startSimulatedFeed();
            });
        }

        function startSimulatedFeed() {
            // Draw synthetic worksite inspection if camera hardware is unavailable
            isReady = true;
            permScreen.style.display = "none";
            setStatus("Live Simulation Stream • 30 FPS", false);
            resizeOverlay();
            requestAnimationFrame(drawHUDLoop);
            setTimeout(function() { captureAndSend(false); }, 800);
        }

        let currentDetections = [];

        // Listen for Streamlit render completion and incoming detection bounding boxes
        window.addEventListener("message", function(event) {
            if (event.data && event.data.type === "streamlit:render") {
                if (event.data.args && event.data.args.detections && Array.isArray(event.data.args.detections)) {
                    currentDetections = event.data.args.detections;
                }
            }
        });

        function resizeOverlay() {
            overlay.width = overlay.clientWidth || 640;
            overlay.height = overlay.clientHeight || 360;
        }
        window.addEventListener('resize', resizeOverlay);

        function drawHUDLoop() {
            if (!isReady) return;
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const w = overlay.width;
            const h = overlay.height;

            if (currentDetections && currentDetections.length > 0) {
                const scaleX = w / 640;
                const scaleY = h / 480;

                currentDetections.forEach(function(d) {
                    if (!d.bbox || d.bbox.length < 4) return;
                    const x = d.bbox[0] * scaleX;
                    const y = d.bbox[1] * scaleY;
                    const bw = Math.max(10, (d.bbox[2] - d.bbox[0]) * scaleX);
                    const bh = Math.max(10, (d.bbox[3] - d.bbox[1]) * scaleY);
                    const cls = d.class_name || "Object";
                    const conf = d.confidence ? Math.round(d.confidence * 100) : 90;
                    const isViolation = cls.startsWith("NO-") || cls.includes("NO_");

                    ctx.lineWidth = 2.5;
                    if (isViolation) {
                        ctx.strokeStyle = "#EF4444";
                        ctx.fillStyle = "#EF4444";
                        ctx.setLineDash([6, 3]);
                    } else if (cls === "Person") {
                        ctx.strokeStyle = "#10B981";
                        ctx.fillStyle = "#10B981";
                        ctx.setLineDash([]);
                    } else {
                        ctx.strokeStyle = "#06B6D4";
                        ctx.fillStyle = "#06B6D4";
                        ctx.setLineDash([]);
                    }

                    // Stroke box
                    ctx.strokeRect(x, y, bw, bh);
                    ctx.setLineDash([]);

                    // Label tag
                    const tagText = (isViolation ? "🚨 " : "✓ ") + cls + " (" + conf + "%)";
                    ctx.font = "bold 11px 'JetBrains Mono', monospace, sans-serif";
                    const tagWidth = ctx.measureText(tagText).width + 12;
                    const tagY = Math.max(0, y - 20);
                    ctx.fillRect(x, tagY, tagWidth, 20);

                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillText(tagText, x + 6, tagY + 14);
                });
            } else {
                // Active reticle when searching for personnel
                const rx = w * 0.25;
                const ry = h * 0.18;
                const rw = w * 0.5;
                const rh = h * 0.64;
                const corner = 22;

                ctx.strokeStyle = "rgba(245, 158, 11, 0.7)";
                ctx.lineWidth = 2;
                ctx.setLineDash([]);

                // Top-left
                ctx.beginPath(); ctx.moveTo(rx, ry + corner); ctx.lineTo(rx, ry); ctx.lineTo(rx + corner, ry); ctx.stroke();
                // Top-right
                ctx.beginPath(); ctx.moveTo(rx + rw - corner, ry); ctx.lineTo(rx + rw, ry); ctx.lineTo(rx + rw, ry + corner); ctx.stroke();
                // Bottom-left
                ctx.beginPath(); ctx.moveTo(rx, ry + rh - corner); ctx.lineTo(rx, ry + rh); ctx.lineTo(rx + corner, ry + rh); ctx.stroke();
                // Bottom-right
                ctx.beginPath(); ctx.moveTo(rx + rw - corner, ry + rh); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx + rw, ry + rh - corner); ctx.stroke();

                ctx.fillStyle = "rgba(245, 158, 11, 0.85)";
                ctx.font = "bold 10px 'JetBrains Mono', monospace, sans-serif";
                ctx.fillText("[ AI NEURAL VISION • SCANNING WORKSPACE ]", rx + 14, ry + 18);
            }

            requestAnimationFrame(drawHUDLoop);
        }

        function captureAndSend(force) {
            if (!isReady) return;
            const now = Date.now();
            if (!force && (now - lastSendTime < 750)) {
                return;
            }
            lastSendTime = now;

            try {
                const ctx = captureCanvas.getContext('2d');
                captureCanvas.width = 640;
                captureCanvas.height = 480;

                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    ctx.drawImage(video, 0, 0, 640, 480);
                } else {
                    // Synthetic worksite background for simulation mode
                    ctx.fillStyle = "#0F172A";
                    ctx.fillRect(0, 0, 640, 480);
                    // Floor
                    ctx.fillStyle = "#1E293B";
                    ctx.fillRect(40, 360, 560, 8);
                    // Worker silhouette
                    ctx.fillStyle = "#334155";
                    ctx.beginPath();
                    ctx.arc(320, 180, 28, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(290, 215, 60, 130);
                    // Draw overlay on top
                    ctx.drawImage(overlay, 0, 0, 640, 480);
                }

                const base64 = captureCanvas.toDataURL('image/jpeg', 0.55);
                sendMessage("streamlit:setComponentValue", { value: base64 });
            } catch (err) {
                console.error("Frame send error:", err);
            }
        }

        // Send a frame to Python every 1000ms for continuous real-time neural detection
        setInterval(function() {
            if (isReady) {
                captureAndSend(false);
            }
        }, 1000);

        initCamera();
    </script>
</body>
</html>
